services:
  ros_container:
    build:
      context: .
      dockerfile: dockerfile
      args:
        distro_image: ${DISTRO_IMAGE:-osrf/ros:humble-desktop-full}
        ROS_DISTRO: ${ROS_DISTRO:-humble}
    image: ${CONTAINER_NAME:-humble_docker}
    container_name: ${CONTAINER_NAME:-humble_docker}
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - ../workspace:/workspace
    devices:
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped

